# Non-secret, fail-closed policy. Host deployment pins these as command-line arguments.
# PRODUCTION executor is the canonical data rail in the isolated TEST database, not a prod profile.
nexion.auth.user-otp.local-fixed-code-enabled=true
nexion.deployment.trusted-proxy-forwarding=true
server.forward-headers-strategy=none
server.address=127.0.0.1
nexion.geo-block.trusted-proxy-addresses=127.0.0.1
nexion.admin-auth.mfa.temporary-superadmin-bypass-enabled=false
nexion.gateway.header-authentication-enabled=false
nexion.home.development-settlement.enabled=false
nexion.treasury.development-reserve.enabled=false
nexion.finance.development-payout-address.enabled=false
nexion.developer.webhooks.allow-loopback=false
nexion.geo-block.allow-loopback-without-country=false
nexion.finance.funds-sandbox.mode=DISABLED
nexion.finance.payment-method-provider.mode=DISABLED
nexion.finance.payout-vnd-provider.mode=DISABLED
nexion.finance.cregis.mode=DISABLED
nexion.finance.hdpay.mode=DISABLED
nexion.janus.executor.mode=PRODUCTION
nexion.janus.executor.production-applied-enabled=false
nexion.compute-task.executor.mode=PRODUCTION
nexion.support.acceptance-sandbox.mode=DISABLED
nexion.market.g2-acceptance-sandbox.mode=DISABLED
nexion.acceptance.f2.coverage-override-enabled=false
nexion.analytics.fixture.enabled=false
nexgrid.sms.itnio.enabled=false
