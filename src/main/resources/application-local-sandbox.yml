# Explicit local development sandbox. Production/default never imports this file.
# Every acceptance-capable domain shares the one server-owned run fence. An empty
# environment value remains fail-closed in each domain's runtime guard.
nexion:
  auth:
    user-otp:
      local-fixed-code-enabled: true
  analytics:
    source-environment: SANDBOX
    acceptance-run-id: ${NEXION_ACCEPTANCE_RUN_ID:}
  support:
    acceptance-run-id: ${NEXION_ACCEPTANCE_RUN_ID:}
    acceptance-sandbox:
      mode: ENABLED
  learning:
    acceptance-run-id: ${NEXION_ACCEPTANCE_RUN_ID:}
  commerce:
    acceptance-run-id: ${NEXION_ACCEPTANCE_RUN_ID:}
