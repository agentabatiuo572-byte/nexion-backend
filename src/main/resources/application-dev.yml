spring:
  config:
    activate:
      on-profile: dev

# The fixed development Passkey account is loopback-only. Never let Tomcat
# rewrite a LAN peer into 127.0.0.1 from caller-controlled forwarding headers.
server:
  forward-headers-strategy: none

# Development uses the canonical local business-data rail. PRODUCTION below is
# data provenance inside the local dev database; it does not select the online
# production database. Provider integrations stay fail-closed without secrets.
nexion:
  developer:
    webhooks:
      allow-loopback: true
  auth:
    user-otp:
      # Current local App rule: +86 uses 123456; +84 continues through ITNIO.
      local-fixed-code-enabled: true
    development-passkey-account:
      country-code: "+86"
      phone: "18708173775"
  home:
    development-settlement:
      enabled: true
  treasury:
    development-reserve:
      enabled: true
      minimum-usdt: 2000000
  finance:
    development-payout-address:
      enabled: true
    funds-sandbox:
      mode: DISABLED
    payment-method-provider:
      mode: DISABLED
  compute-task:
    executor:
      mode: PRODUCTION
  janus:
    executor:
      mode: PRODUCTION
  geo-block:
    allow-loopback-without-country: true
  analytics:
    source-environment: PRODUCTION
  support:
    acceptance-sandbox:
      mode: DISABLED
  market:
    g2-acceptance-sandbox:
      mode: DISABLED
  acceptance:
    f2:
      coverage-override-enabled: false
