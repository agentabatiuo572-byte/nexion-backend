<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直属分成 · 交互演练</title>
<style>
:root{color-scheme:dark;--bg:#10120e;--panel:#191c16;--fg:#eef2e9;--muted:#a3ae97;--accent:#b8e84d;--line:#343c2b;--danger:#f3aa92}*{box-sizing:border-box}body{margin:auto;padding:24px;max-width:980px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui}h1{font-size:26px}h2{font-size:19px}section{padding:20px 0;border-top:1px solid var(--line)}p{color:var(--muted)}label{display:flex;flex-direction:column;gap:5px}input,select,button{font:inherit;padding:10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent)}button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg)}button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.error{color:var(--danger)}[hidden]{display:none!important}output{display:block;font-size:22px;overflow-wrap:anywhere}small{color:var(--muted)}@media(max-width:600px){body{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<h1>直属分成 · 交互演练</h1><p>设计演练，不连接业务 API，不修改钱包或正式政策。正式界面复用现有 F2 与 Team 样式；此页只核对输入、确认、取消、四态和解释口径。</p>
<form id="policy"><section><h2>购买分成</h2><div class="grid"><label>启用<select name="purchaseEnabled"><option value="false">关闭</option><option value="true">开启</option></select></label><label>总分成比例 %<input name="purchaseRate" type="number" min="0" max="100" step="0.000001" value="0" required></label><label>USDT 占比 %<input name="purchaseShare" type="number" min="0" max="100" step="0.000001" value="50" required></label><label>等待天数<input name="purchaseCooling" type="number" min="0" max="365" step="1" value="0" required></label></div></section>
<section><h2>设备收益分成</h2><div class="grid"><label>启用<select name="earningEnabled"><option value="false">关闭</option><option value="true">开启</option></select></label><label>总分成比例 %<input name="earningRate" type="number" min="0" max="100" step="0.000001" value="0" required></label><label>USDT 占比 %<input name="earningShare" type="number" min="0" max="100" step="0.000001" value="50" required></label><label>等待天数<input name="earningCooling" type="number" min="0" max="365" step="1" value="0" required></label></div><p>每类 NEX 占比自动为 100% 减去 USDT 占比。平台额外支付，成员原收益不减少。</p><div class="actions"><button type="submit" class="primary">预览整组提交</button><button type="button" id="example">填入测试示例</button></div><p id="error" class="error" role="alert"></p></section></form>
<section id="confirm" hidden aria-labelledby="confirmTitle"><h2 id="confirmTitle">确认政策</h2><p id="preview"></p><label>修改理由（8–200字）<input id="reason" minlength="8" maxlength="200"></label><div class="actions"><button id="approve" class="primary">演练提交审批</button><button id="cancel">取消，保留草稿</button></div><p id="saveStatus" role="status" aria-live="polite"></p></section>
<section><h2>App 直属奖励</h2><div class="actions"><button data-state="default">默认</button><button data-state="empty">空状态</button><button data-state="loading">加载</button><button data-state="error">报错</button></div><div id="list" aria-live="polite"></div><button id="retry" hidden>重试</button><p>A 邀请 B、B 邀请 C：B 的购买与设备收益给 A 分成，C 的这两类分成只给 B。B 收到的邀请奖励不会继续给 A 分成。今日对碰、等级、培育奖和领导池保留原规则。</p></section>
<script>
const form=document.querySelector('#policy'),message=document.querySelector('#error'),confirmBox=document.querySelector('#confirm');
const value=n=>Number(form.elements.namedItem(n).value);let state='default';
function preview(){return ['purchase','earning'].map((p,i)=>{const enabled=form.elements.namedItem(p+'Enabled').value==='true',rate=value(p+'Rate'),share=value(p+'Share'),days=value(p+'Cooling');if(!Number.isFinite(rate)||rate<0||rate>100||!Number.isFinite(share)||share<0||share>100||!Number.isInteger(days)||days<0||days>365||(enabled&&(rate<=0||share<=0||share>=100)))throw Error('启用时总比例须大于 0，USDT 与 NEX 都须占有比例；等待期为 0–365 整天。');return `${i?'设备收益':'购买'}：${enabled?'开启':'关闭'}，总比例 ${rate}%，USDT ${share}% / NEX ${100-share}%，等待 ${days} 天`;}).join('；');}
form.addEventListener('submit',e=>{e.preventDefault();message.textContent='';try{document.querySelector('#preview').textContent=preview();document.querySelector('#saveStatus').textContent='';confirmBox.hidden=false;document.querySelector('#reason').focus();}catch(error){message.textContent=error.message;}});
document.querySelector('#cancel').onclick=()=>{confirmBox.hidden=true;form.querySelector('button').focus();};
document.querySelector('#approve').onclick=()=>{const reason=document.querySelector('#reason').value.trim();document.querySelector('#saveStatus').textContent=reason.length<8?'请填写至少 8 字的修改理由。':'演练结果：进入待审批状态。正式系统须经服务端审批后才生效，此处未写入业务数据。';};
document.querySelector('#example').onclick=()=>{for(const [key,v]of Object.entries({purchaseEnabled:'true',purchaseRate:'10',purchaseShare:'60',purchaseCooling:'0',earningEnabled:'true',earningRate:'5',earningShare:'60',earningCooling:'0'}))form.elements.namedItem(key).value=v;message.textContent='已填测试示例，正式费率仍需运营配置。';};
function render(next){state=next;const list=document.querySelector('#list');list.replaceChildren();const text=document.createElement('p');text.textContent=state==='empty'?'尚无直属分成，可从 Team 邀请入口邀请成员。':state==='loading'?'正在加载直属奖励与到账状态…':state==='error'?'奖励暂时无法加载，请重试。':'演练账单：B 购买设备实付 1,000 USDT，测试总比例 10%、拆分 60% / 40%、NEX 价格 0.01 USDT。';list.append(text);if(state==='default'){const amount=document.createElement('output');amount.textContent='60 USDT + 4,000 NEX · 已到账（演练）';list.append(amount);}document.querySelector('#retry').hidden=state!=='error';list.setAttribute('aria-busy',String(state==='loading'));}
document.querySelectorAll('[data-state]').forEach(button=>button.onclick=()=>render(button.dataset.state));document.querySelector('#retry').onclick=()=>render('default');render(state);
</script></html>
